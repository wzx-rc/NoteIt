name: Relevé Money Tree

# Relit la ferme toutes les 10 minutes pour la page « Pops Money Tree » de Harvest Desk.
# Les relevés vont dans le fichier reads.jsonl de la branche procs-data (un seul commit, remplacé à chaque fois).
# À régler une fois : Settings > Secrets and variables > Actions > New repository secret, nom SFL_API_KEY.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sfl-reads
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - name: Récupérer les relevés
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git clone -q --depth 1 --branch procs-data "$url" data 2>/dev/null; then
            mkdir data && cd data && git init -q -b procs-data && git remote add origin "$url"
          fi

      - name: Relever la ferme
        env:
          SFL_API_KEY: ${{ secrets.SFL_API_KEY }}
          SFL_FARM_ID: ${{ vars.SFL_FARM_ID || '150782' }}
        run: node .github/scripts/sfl-reads.mjs data/reads.jsonl

      - name: Enregistrer
        run: |
          cd data
          git config user.name "harvest-desk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reads.jsonl
          if git rev-parse -q --verify HEAD >/dev/null; then git commit -q --amend -m "Relevés Money Tree"; else git commit -q -m "Relevés Money Tree"; fi
          git push -q -f origin procs-data
