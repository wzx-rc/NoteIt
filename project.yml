name: NoteIt
options:
  bundleIdPrefix: com.wzxrc
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  NoteIt:
    type: application
    platform: iOS
    sources:
      - path: NoteIt/Sources
      - path: NoteIt/Assets.xcassets
      - path: NoteIt/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wzxrc.noteit
        PRODUCT_NAME: NoteIt
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    info:
      path: NoteIt/Info.plist
      properties:
        CFBundleDisplayName: NoteIt
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: Ajouter des images à vos notes.
        NSCameraUsageDescription: Prendre une photo pour l'ajouter à une note.
        NSMicrophoneUsageDescription: Dicter vos demandes à l'assistant.
        NSSpeechRecognitionUsageDescription: Transformer votre voix en texte pour l'assistant.
        ITSAppUsesNonExemptEncryption: false

  NotelyHub:
    type: application
    platform: iOS
    sources:
      - path: NotelyHub/Sources
      - path: NotelyHub/Assets.xcassets
      - path: NotelyHub/Web
        type: folder
        buildPhase: resources
    settings:
      base:
        MARKETING_VERSION: "0.2.34"
        PRODUCT_BUNDLE_IDENTIFIER: com.wzxrc.notelyhub
        PRODUCT_NAME: NotelyHub
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    info:
      path: NotelyHub/Info.plist
      properties:
        CFBundleDisplayName: PLUM
        NSMicrophoneUsageDescription: "PLUM utilise le micro pour la dictée : votre voix est envoyée à OpenAI pour être transcrite en texte."
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryUsageDescription: Ajouter des images à vos notes et boards.
        NSCameraUsageDescription: Prendre une photo pour l'ajouter à une note ou un board.
        ITSAppUsesNonExemptEncryption: false
